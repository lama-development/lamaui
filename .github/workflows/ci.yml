name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate components and guides
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Check package boundaries
        run: npm run check:package

      - name: Build package consumer fixture
        run: npm run test:consumer

      - name: Validate package contents
        run: npm run test:package

      - name: Build documentation
        run: npm run build

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Test components and guides
        run: npm run test:e2e -- --workers=2 --reporter=github,html

      - name: Save browser report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
